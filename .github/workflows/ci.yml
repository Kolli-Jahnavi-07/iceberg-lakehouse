name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make lint
      - name: Tests (pipeline, evolution, time travel, maintenance, concurrency)
        run: make test
      - name: Demo (smaller fleet to keep CI fast)
        run: PYTHONPATH=src python -m lakehouse demo --days 70 --vehicles 80
